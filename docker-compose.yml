services:
  supervisor-agent:
    image: "${SUPERVISOR_AGENT_IMAGE:-ghcr.io/sensorsphere/sensorsphere-supervisor-agent:latest}"
    restart: unless-stopped
    environment:
      SENSORSPHERE_URL: "${SENSORSPHERE_URL:-}"
      SENSORSPHERE_AGENT_TOKEN: "${SENSORSPHERE_AGENT_TOKEN:-}"
      SUPERVISOR_NAME: "${SUPERVISOR_NAME:-}"
      SENSORSPHERE_HEARTBEAT_INTERVAL_MS: "${SENSORSPHERE_HEARTBEAT_INTERVAL_MS:-30000}"
      SUPERVISOR_SOCKET_PATH: "${SUPERVISOR_SOCKET_PATH:-/run/sensorsphere-supervisor-agent/supervisor.sock}"
      SUPERVISOR_SOCKET_GID: "${SUPERVISOR_SOCKET_GID:-0}"
      SUPERVISOR_MANAGED_ROOT: "${SUPERVISOR_MANAGED_ROOT}"
      SUPERVISOR_DEFAULT_PUID: "${SUPERVISOR_DEFAULT_PUID:-1000}"
      SUPERVISOR_DEFAULT_PGID: "${SUPERVISOR_DEFAULT_PGID:-1000}"
      SUPERVISOR_OPERATION_TIMEOUT_MS: "${SUPERVISOR_OPERATION_TIMEOUT_MS:-120000}"
      SUPERVISOR_SELF_INSTALL_DIR: "${SUPERVISOR_SELF_INSTALL_DIR:-}"
      SUPERVISOR_SELF_UPDATE_TIMEOUT_MS: "${SUPERVISOR_SELF_UPDATE_TIMEOUT_MS:-120000}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${SUPERVISOR_SOCKET_DIR:-/run/sensorsphere-supervisor-agent}:/run/sensorsphere-supervisor-agent"
      # The generic managed root is mounted at the same absolute path inside the
      # Supervisor so Compose project directories and relative bind mounts resolve
      # identically on the host and in the Supervisor container.
      - "${SUPERVISOR_MANAGED_ROOT}:${SUPERVISOR_MANAGED_ROOT}"
